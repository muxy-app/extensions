<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Browser</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <main class="browser-app">
    <header class="toolbar">
      <form id="url-form" class="url-form" autocomplete="off">
        <input id="url-input" type="text" aria-label="URL" placeholder="Search or enter URL">
      </form>
      <div class="nav-group">
        <button id="back-btn" type="button" class="nav-btn" title="Back" aria-label="Back">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </button>
        <button id="forward-btn" type="button" class="nav-btn" title="Forward" aria-label="Forward">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6"></path>
          </svg>
        </button>
        <button id="reload-btn" type="button" class="nav-btn" title="Reload" aria-label="Reload">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8.1 8.1 0 0 0-15.5-2"></path>
            <path d="M4 5v4h4"></path>
            <path d="M4 13a8.1 8.1 0 0 0 15.5 2"></path>
            <path d="M20 19v-4h-4"></path>
          </svg>
        </button>
        <div class="nav-sep" aria-hidden="true"></div>
        <button
          id="annotate-btn"
          type="button"
          class="nav-btn"
          title="Toggle annotation mode"
          aria-label="Toggle annotation mode"
          aria-pressed="false"
        >
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5c-3.5 0-6.5 2.8-6.5 6.3 0 4.7 6.5 12.7 6.5 12.7s6.5-8 6.5-12.7c0-3.5-3-6.3-6.5-6.3z"></path>
            <circle cx="12" cy="9" r="2.2"></circle>
          </svg>
          <span id="annotate-count" class="annotate-count" hidden>0</span>
        </button>
        <button
          id="export-btn"
          type="button"
          class="nav-btn"
          title="Copy annotations for agent"
          aria-label="Copy annotations for agent"
          disabled
        >
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="3.5" width="11" height="14" rx="2"></rect>
            <path d="M16 7h-2.5a2 2 0 0 0-2 2v11.5h-4a2 2 0 0 1-2-2V7.5"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="viewport">
      <div id="frame-loader" class="frame-loader" aria-hidden="true">
        <img id="frame-loader-icon" class="frame-loader-icon" alt="">
        <div id="frame-loader-host" class="frame-loader-host"></div>
        <div class="frame-loader-bar"><span></span></div>
      </div>
      <iframe
        id="browser-frame"
        title="Web Browser View"
        referrerpolicy="no-referrer-when-downgrade"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
      ></iframe>
      <div id="annotation-layer" class="annotation-layer" aria-hidden="true"></div>
      <div id="annotation-toast" class="annotation-toast" role="status" aria-live="polite"></div>
    </section>

    <div id="annotation-popover" class="annotation-popover" role="dialog" aria-label="Annotation comment" hidden>
      <header class="annotation-popover-head">
        <span id="annotation-popover-title" class="annotation-popover-title">Pin</span>
        <button id="annotation-delete" type="button" class="annotation-popover-delete" title="Delete pin" aria-label="Delete pin">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h14"></path>
            <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
            <path d="M7 7l1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12"></path>
          </svg>
        </button>
      </header>
      <textarea
        id="annotation-text"
        class="annotation-textarea"
        rows="4"
        placeholder="Note for the agent…"
      ></textarea>
      <footer class="annotation-popover-foot">
        <button id="annotation-cancel" type="button" class="annotation-btn">Cancel</button>
        <button id="annotation-save" type="button" class="annotation-btn is-primary">Save</button>
      </footer>
    </div>
  </main>

  <script type="module" src="./browser.js"></script>
</body>
</html>
