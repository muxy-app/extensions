<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Browser</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <main class="browser-app">
    <form id="url-form" class="url-form" autocomplete="off">
      <input id="url-input" type="text" aria-label="URL" placeholder="Search or enter URL">
    </form>
    <p id="status" class="status" role="status"></p>
    <section class="recent" aria-labelledby="recent-title">
      <h2 id="recent-title" class="recent-title">Recent</h2>
      <ul id="recent-list" class="recent-list"></ul>
      <p id="recent-empty" class="recent-empty">Pages you open appear here.</p>
    </section>
  </main>

  <script type="module" src="./browser.js"></script>
</body>
</html>
