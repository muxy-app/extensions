<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workdeck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <label class="search">
      <span class="slot" data-icon="search"></span>
      <input id="q" type="text" placeholder="프로젝트 검색" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="프로젝트 검색">
      <button id="q-clear" type="button" title="지우기" aria-label="검색어 지우기" hidden>×</button>
    </label>
    <button class="icon-btn compact-only" id="q-open" title="프로젝트 빠른 전환" aria-label="프로젝트 빠른 전환"><span class="slot" data-icon="search"></span></button>
    <button class="icon-btn" id="add-group" title="새 그룹(워크스페이스) 만들기" aria-label="새 그룹 만들기"><span class="slot" data-icon="layersplus"></span></button>
    <button class="icon-btn accent" id="add-folder" title="폴더 추가 (Muxy 프로젝트 열기)" aria-label="폴더 추가"><span class="slot" data-icon="folderplus"></span></button>
    <button class="icon-btn" id="more" title="더 보기" aria-label="더 보기">⋯</button>
  </header>
  <div id="home-slot"></div>
  <div id="stack">
    <section class="sec" id="sec-workspaces">
      <div id="head-workspaces"></div>
      <div class="sec-body" id="list"></div>
    </section>
    <div class="splitter" id="split-agents" data-key="agents" title="드래그해서 크기 조절 · 더블클릭하면 초기화" hidden></div>
    <section class="sec" id="sec-agents" hidden></section>
    <div class="splitter" id="split-remote" data-key="remote" title="드래그해서 크기 조절 · 더블클릭하면 초기화" hidden></div>
    <section class="sec" id="sec-remote" hidden></section>
  </div>
  <footer class="foot">
    <button class="foot-btn icon-only" id="settings" title="Settings" aria-label="Settings"><span class="slot" data-icon="gear"></span></button>
    <button class="foot-btn icon-only" id="ext" title="Extensions" aria-label="Extensions"><span class="slot" data-icon="puzzle"></span></button>
  </footer>
  <div id="menu" class="menu" hidden></div>
  <div id="overlay" class="overlay" hidden></div>
  <script src="../i18n.js"></script>
  <script src="shared.js"></script>
  <script src="core.js"></script>
  <script src="add.js"></script>
  <script src="view.js"></script>
  <script src="main.js"></script>
</body>
</html>
