<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">
        <span class="brand-title">Docker</span>
        <button class="engine-pill" id="engine" data-action="context" title="Docker context">
          <span class="dot"></span><span class="engine-text">Connecting…</span>
        </button>
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-action="refresh" title="Refresh" aria-label="Refresh" id="refresh-btn"></button>
        <button class="icon-btn" data-action="app-menu" title="More" aria-label="More" id="menu-btn"></button>
      </div>
    </header>

    <div class="stage">
    <nav class="tabs" id="tabs" role="tablist"></nav>

    <div class="toolbar" id="toolbar">
      <label class="search">
        <span class="search-icon" id="search-icon"></span>
        <input id="filter" type="text" placeholder="Filter" spellcheck="false" autocomplete="off">
        <button class="search-clear" data-action="clear-filter" title="Clear" aria-label="Clear filter" hidden></button>
      </label>
      <div class="toolbar-actions" id="toolbar-actions"></div>
    </div>

    <main class="list" id="list"></main>

    <footer class="footer" id="footer"></footer>

    <section class="detail" id="detail" aria-hidden="true"></section>
    </div>
  </div>

  <div class="menu" id="menu" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
