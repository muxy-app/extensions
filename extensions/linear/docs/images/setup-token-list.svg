<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="-apple-system, system-ui, sans-serif">
  <!-- 설정의 API 키 select box + 별도 "API 키 관리" 모달 -->
  <!-- (상단) 설정 화면: 드롭다운으로 활성 키 선택 -->
  <rect x="0.5" y="0.5" width="559" height="128" rx="12" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="24" y="34" font-size="13" font-weight="700" fill="#1c1f26">설정 · Personal API Key</text>
  <!-- select -->
  <rect x="24" y="50" width="330" height="30" rx="6" fill="#f6f7f9" stroke="#e3e6eb"/>
  <text x="38" y="70" font-size="12" fill="#1c1f26">회사 계정</text>
  <text x="338" y="70" font-size="12" fill="#5b616e">▾</text>
  <!-- 관리 버튼 -->
  <rect x="364" y="50" width="120" height="30" rx="6" fill="#f0f2f5" stroke="#e3e6eb"/>
  <text x="424" y="70" font-size="12" fill="#1c1f26" text-anchor="middle">🔑 API 키 관리</text>
  <text x="24" y="104" font-size="11.5" fill="#5b616e">사용할 키는 <tspan font-weight="700" fill="#5e6ad2">드롭다운</tspan>에서 고르고, 등록·삭제는 <tspan font-weight="700">API 키 관리</tspan> 모달에서.</text>

  <!-- (하단) API 키 관리 모달 -->
  <rect x="0.5" y="150" width="559" height="179" rx="12" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="24" y="180" font-size="13" font-weight="700" fill="#1c1f26">Personal API Key 관리</text>
  <!-- 행 1 -->
  <rect x="24" y="194" width="150" height="26" rx="6" fill="#f6f7f9" stroke="#e3e6eb"/>
  <text x="34" y="211" font-size="11.5" fill="#1c1f26">회사 계정</text>
  <rect x="182" y="194" width="270" height="26" rx="6" fill="#f6f7f9" stroke="#e3e6eb"/>
  <text x="192" y="211" font-size="11.5" fill="#5b616e">lin_api_••••••••••••••••</text>
  <rect x="460" y="194" width="58" height="26" rx="6" fill="#f0f2f5" stroke="#e3e6eb"/>
  <text x="489" y="211" font-size="11" fill="#5b616e" text-anchor="middle">삭제</text>
  <!-- 행 2 -->
  <rect x="24" y="226" width="150" height="26" rx="6" fill="#f6f7f9" stroke="#e3e6eb"/>
  <text x="34" y="243" font-size="11.5" fill="#1c1f26">개인 계정</text>
  <rect x="182" y="226" width="270" height="26" rx="6" fill="#f6f7f9" stroke="#e3e6eb"/>
  <text x="192" y="243" font-size="11.5" fill="#5b616e">lin_api_••••••••••••••••</text>
  <rect x="460" y="226" width="58" height="26" rx="6" fill="#f0f2f5" stroke="#e3e6eb"/>
  <text x="489" y="243" font-size="11" fill="#5b616e" text-anchor="middle">삭제</text>
  <!-- 추가 + 저장 -->
  <rect x="24" y="264" width="110" height="26" rx="6" fill="#f0f2f5" stroke="#e3e6eb"/>
  <text x="79" y="281" font-size="11.5" fill="#5b616e" text-anchor="middle">＋ API 키 추가</text>
  <rect x="452" y="262" width="66" height="30" rx="7" fill="#5e6ad2"/>
  <text x="485" y="282" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">저장</text>
  <text x="24" y="312" font-size="11" fill="#8b93a7">각 행: 설명 + 키 값. 키가 빈 행은 저장 시 무시됩니다.</text>
</svg>
