<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Cheatsheets: a terminal prompt printed on a book cover">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- The tile is the book cover; the spine runs down the left edge. -->
  <rect width="512" height="512" rx="112" fill="url(#cover)"/>
  <g clip-path="url(#tile)">
    <rect width="84" height="512" fill="#000" opacity="0.22"/>
    <rect x="26" y="150" width="32" height="26" rx="13" fill="#fff" opacity="0.5"/>
    <rect x="26" y="336" width="32" height="26" rx="13" fill="#fff" opacity="0.5"/>
  </g>

  <!-- >_ — the page it is opened to. -->
  <path d="M186 182 L256 256 L186 330" fill="none" stroke="#fff" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="288" y="302" width="126" height="30" rx="15" fill="#fff"/>
</svg>
