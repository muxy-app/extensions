<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34333c"/>
      <stop offset="1" stop-color="#1c1b21"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4efff"/>
      <stop offset="1" stop-color="#c9ddfa"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="window"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <g clip-path="url(#window)">
    <!-- ribbons tucked behind the right edge -->
    <g filter="url(#soft)">
      <rect x="224" y="58"  width="60" height="24" rx="8" fill="#f0cb45"/>
      <rect x="224" y="88"  width="60" height="24" rx="8" fill="#ec88ad"/>
      <rect x="206" y="118" width="70" height="24" rx="8" fill="#78aaec"/>
      <rect x="224" y="148" width="60" height="24" rx="8" fill="#a690f0"/>
      <rect x="224" y="178" width="60" height="24" rx="8" fill="#74c98f"/>
    </g>

    <!-- the note pulled out of the blue ribbon -->
    <g filter="url(#lift)">
      <rect x="34" y="66" width="160" height="128" rx="20" fill="url(#paper)"/>
    </g>
    <rect x="54" y="86" width="72" height="11" rx="5.5" fill="#29282d" opacity=".82"/>
    <g fill="none" stroke="#29282d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
      <rect x="54" y="115" width="13" height="13" rx="3.5"/>
      <path d="M78 121.5h76"/>
      <path d="M78 147.5h58"/>
      <rect x="54" y="167" width="13" height="13" rx="3.5"/>
      <path d="M78 173.5h66"/>
    </g>
    <rect x="51.5" y="138.5" width="18" height="18" rx="5" fill="#29282d" opacity=".78"/>
    <path d="M55.5 147.8l3.4 3.4 6.4-7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
