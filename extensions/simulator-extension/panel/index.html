<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar top">
    <div class="select-wrap">
      <select id="device" aria-label="Simulator" disabled></select>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
    </div>
    <button id="power" class="icon" title="Boot" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.6 6.6a7.6 7.6 0 1 0 10.8 0"/></svg>
    </button>
  </header>

  <main id="stage">
    <div id="bezel" hidden>
      <canvas id="screen" tabindex="0" aria-label="Simulator screen"></canvas>
      <div class="finger" id="finger1"></div>
      <div class="finger" id="finger2"></div>
    </div>
    <div id="message" class="message" hidden>
      <div class="spinner" id="message-spinner"></div>
      <h2 id="message-title"></h2>
      <p id="message-detail"></p>
      <button id="message-action" class="primary" type="button"></button>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>

  <form id="urlbar" class="bar urlbar" hidden>
    <input id="url" type="text" placeholder="https://example.com or myapp://path" autocomplete="off" spellcheck="false">
    <button type="submit" class="primary">Open</button>
  </form>

  <footer class="bar bottom">
    <button class="icon" data-action="home" title="Home (⌘⇧H)" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7"/><path d="M6.5 10v9.5h11V10"/></svg>
    </button>
    <button class="icon" data-action="switcher" title="App Switcher" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="10" height="13" rx="2"/><path d="M8 4h10.5a2 2 0 0 1 2 2v11"/></svg>
    </button>
    <button class="icon" data-action="lock" title="Lock" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
    </button>
    <span class="sep"></span>
    <button class="icon" data-action="appearance" title="Toggle Light/Dark" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" class="fill"/></svg>
    </button>
    <button class="icon" data-action="paste" title="Paste Mac Clipboard (⌘V)" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="13" height="16" rx="2"/><path d="M9 5V3.5h6V5"/><path d="M9 11h6M9 15h4"/></svg>
    </button>
    <button class="icon" data-action="url" title="Open URL" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </button>
    <button class="icon" data-action="screenshot" title="Screenshot to Desktop and Clipboard" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3V19H4Z"/><circle cx="12" cy="13.2" r="3.3"/></svg>
    </button>
    <span class="sep"></span>
    <button class="icon" data-action="simulator" title="Open in Xcode’s Simulator / Device Hub" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="m20 4-8.5 8.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </button>
  </footer>

  <script src="keymap.js"></script>
  <script src="app.js"></script>
</body>
</html>
