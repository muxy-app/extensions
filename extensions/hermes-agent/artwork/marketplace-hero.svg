  <text x="100" y="510" fill="#D1CBDC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="450" letter-spacing="-.7" aria-label="Start agent work, handle approvals, and keep projects moving.">Start agent work, handle approvals,</text>
