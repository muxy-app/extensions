name: ${QUAL_PROJECT}

x-hermes-image: &hermes-image nousresearch/hermes-agent:v2026.8.16@sha256:f8f548d87d16634d1ad9e3777280f3f577ba2358703f04e18e74007ffd3621bf

services:
  model-stub:
    image: *hermes-image
    entrypoint: ["python3", "/fixture/model-stub.py"]
    environment:
      MODEL_STUB_DELAY_MS: "120"
    volumes:
      - ./model-stub.py:/fixture/model-stub.py:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  hermes:
    image: *hermes-image
    command: ["gateway", "run", "--force"]
    depends_on:
      model-stub:
        condition: service_healthy
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "muxy"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${QUAL_PASSWORD_HASH}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${QUAL_SESSION_SECRET}
      OPENAI_API_KEY: "qualification-fixture-not-a-secret"
    volumes:
      - ${QUAL_ROOT}/hermes:/opt/data
    ports:
      - "127.0.0.1::9119"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=3)); assert r.get('auth_required') is True"]
      interval: 3s
      timeout: 4s
      retries: 40
      start_period: 20s

  sshd:
    # OpenSSH 10.3_p1-r0-ls233, image digest captured 2026-08-20.
    image: lscr.io/linuxserver/openssh-server@sha256:96b9a4d3b5106746d08d43a6911650d4d21f7d5c7f2ac9660e792bdb5e63157c
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      PUBLIC_KEY_FILE: /run/secrets/muxy.pub
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "false"
      USER_NAME: "muxy"
      LOG_STDOUT: "true"
    volumes:
      - ${QUAL_ROOT}/sshd:/config
      - ${QUAL_ROOT}/keys/muxy.pub:/run/secrets/muxy.pub:ro
    ports:
      - "127.0.0.1::2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  cloudflared:
    # cloudflared 2026.8.2, image digest captured 2026-08-20.
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    depends_on:
      hermes:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://hermes:9119", "--http-host-header", "hermes"]
    restart: "no"

networks:
  default:
    labels:
      dev.muxy.hermes.qualification: ${QUAL_PROJECT}
