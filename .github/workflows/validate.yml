name: Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "extensions/**"
      - "scripts/**"
      - ".github/workflows/**"
  # Title rewrite + version-bump gate. This needs a writable token for fork PRs,
  # so it runs from the trusted base branch via pull_request_target. The job
  # never checks out the fork: trusted code reads exact-SHA PR data through the
  # GitHub API, validates it, then performs the narrowly scoped PR updates.
  pull_request_target:
    branches: [main]
    paths:
      - "extensions/**"

permissions:
  contents: read

# The build job (pull_request) and metadata gate (pull_request_target) run from
# different trust contexts and must not cancel each other.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extensions
    # This job executes the PR's code, so it runs only with the read-only fork
    # token and no secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to isolate extensions changed by this PR.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install tooling
        run: npm ci

      - name: Test trusted tooling
        run: npm test

      - name: Determine changed extensions
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Diff against the merge base so changes that landed on main after
          # this PR forked are not attributed to the PR.
          if mb="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            diff_base="$mb"
          else
            echo "::warning::no merge base for $BASE_SHA..$HEAD_SHA; comparing against the base tip directly."
            diff_base="$BASE_SHA"
          fi

          changed="$(git diff --name-only "$diff_base" "$HEAD_SHA" -- extensions/ \
            | awk -F/ 'NF>1 && $1=="extensions" {print $2}' \
            | sort -u)"

          # Tooling-only PRs build and validate everything because scripts or
          # workflow changes can affect every extension.
          if [ -z "$changed" ]; then
            echo "No extension changed (tooling-only PR); building and validating all."
            echo "names=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed extensions:"
            printf '  - %s\n' $changed
            echo "names=$(printf '%s' "$changed" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changed extensions
        run: node scripts/build.mjs ${{ steps.changed.outputs.names }}

      - name: Validate changed extensions
        run: node scripts/validate.mjs ${{ steps.changed.outputs.names }}

      - name: Dry-run pack (prove deterministic zip + hash)
        run: node scripts/pack.mjs --dry-run ${{ steps.changed.outputs.names }}

  pr-meta:
    name: Enforce version bump and PR title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # pull_request_target resolves github.sha to the trusted base branch.
      # Only this trusted tooling is checked out; the fork is accessed by API.
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate metadata and update PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pr-meta-ci.mjs
