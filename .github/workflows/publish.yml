name: Publish

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "official.json"
  # Refresh download counts in the index once a day.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      extensions:
        description: "Space-separated extension names to release. Empty = only regenerate the index."
        required: false
        default: ""

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Release changed extensions and update the index
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The extension builds below run third-party build tooling, so the token
      # is not persisted in .git/config; only the release and index steps get it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install tooling
        run: npm ci

      - name: Determine changed extensions
        id: changed
        if: github.event_name != 'schedule'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_INPUT: ${{ github.event.inputs.extensions }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$DISPATCH_INPUT"
          else
            before="$BEFORE_SHA"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="HEAD~1"
            fi
            if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "::warning::before ref '$before' is not available; falling back to HEAD~1"
              before="HEAD~1"
            fi
            raw="$(git diff --name-only "$before" "$AFTER_SHA" -- extensions/ \
              | awk -F/ 'NF>1 && $1=="extensions" {print $2}' \
              | sort -u)"
          fi

          names=""
          for name in $raw; do
            if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "::warning::skipping name with invalid characters: '$name'"
              continue
            fi
            if [ ! -f "extensions/$name/package.json" ]; then
              echo "skip $name (removed)"
              continue
            fi
            names="$names $name"
          done
          names="$(printf '%s' "$names" | sed 's/^ *//')"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${names:-<none>}"

      - name: Build changed extensions
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
        run: node scripts/build.mjs $NAMES

      - name: Validate changed extensions
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
        run: node scripts/validate.mjs $NAMES

      - name: Install minisign
        if: steps.changed.outputs.names != ''
        env:
          HAS_SIGNING_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            sudo apt-get update && sudo apt-get install -y minisign
          fi

      - name: Pack, sign, release, and announce
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # Optional: when set, each new release posts a one-line note with the
          # release link to Discord. Unset = no announcement.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/publish.mjs $NAMES

      - name: Update the index branch
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/index.mjs
