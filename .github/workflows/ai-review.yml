name: AI security review

# Copilot malware gate for extension PRs. It runs on every push to a PR: it
# approves the PR when Copilot and the deterministic checks find nothing
# malicious, and otherwise requests changes or leaves a comment.
#
# Trust model (pull_request_target, so fork PRs get a working token):
#   review — read-only token plus Copilot requests. Trusted tooling from the
#            base branch fetches the PR at its exact head SHA through the API.
#            Fork code is never checked out or executed. Copilot gets only the
#            read-only view/grep/glob tools, confined to a directory that
#            holds nothing but the PR's files: no shell, no writes, no network,
#            no MCP servers, and no repository instructions.
#   decide — the only job with a writable token. It never sees the fork or the
#            model, only the artifact. It validates the verdict as untrusted
#            JSON and posts the review.
#
# Spend limits (to stop push or PR spam from draining Copilot credits):
#   - Each run waits AI_REVIEW_DEBOUNCE_SECONDS (default 90) before doing
#     anything, so a burst of pushes cancels down to one review.
#   - Copilot runs at most AI_REVIEW_DAILY_LIMIT times per 24h for the whole
#     repository (default 30) and AI_REVIEW_AUTHOR_DAILY_LIMIT per author
#     (default 10). Owners, members and collaborators are exempt. Over the
#     limit, the PR gets one "paused" notice instead of a review.
#   - Each review is capped at AI_REVIEW_MAX_AI_CREDITS (default 30).
#   - A maintainer can always run a review now, skipping the wait and the
#     limits, by adding the `ai-review` label to the PR. The label is removed
#     again afterwards.
#
# Setup: see "Automated malware review" in SECURITY.md.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "extensions/**"

permissions: {}

concurrency:
  # Adding an unrelated label must not cancel a review in progress, so those
  # events get a group of their own (and then skip every job).
  group: ai-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'ai-review' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: Copilot review
    if: github.event.action != 'labeled' || github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      # Read this workflow's recent runs to enforce the daily limits.
      actions: read
      copilot-requests: write
    env:
      COPILOT_VERSION: "1.0.105"
    steps:
      # A newer push cancels this run (see concurrency) before any API call or
      # Copilot request is made.
      - name: Wait for more pushes
        if: github.event.action != 'labeled'
        env:
          DEBOUNCE_VAR: ${{ vars.AI_REVIEW_DEBOUNCE_SECONDS }}
        run: |
          seconds="${DEBOUNCE_VAR:-90}"
          case "$seconds" in ''|*[!0-9]*) seconds=90 ;; esac
          echo "Waiting ${seconds}s before reviewing."
          sleep "$seconds"

      # pull_request_target resolves github.sha to the trusted base branch.
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Collect the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_DIR: ${{ runner.temp }}/ai-review
          AI_REVIEW_FLAG: ${{ github.workspace }}/ai-review-run.flag
          AI_REVIEW_DAILY_LIMIT: ${{ vars.AI_REVIEW_DAILY_LIMIT }}
          AI_REVIEW_AUTHOR_DAILY_LIMIT: ${{ vars.AI_REVIEW_AUTHOR_DAILY_LIMIT }}
        run: node scripts/ai-review-collect.mjs

      # The collector writes the flag only when Copilot should run. When it is
      # missing, these steps show as skipped, which is how later runs tell
      # that this one spent no credits.
      - name: Install Copilot CLI
        if: hashFiles('ai-review-run.flag') != ''
        run: npm install --global --ignore-scripts --no-audit --no-fund "@github/copilot@${COPILOT_VERSION}"

      - name: Ask Copilot for a verdict
        if: hashFiles('ai-review-run.flag') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_DIR: ${{ runner.temp }}/ai-review
          # Optional: a fine-grained PAT with the "Copilot Requests" permission,
          # for when org-billed Copilot CLI is not available. Unset = use
          # GITHUB_TOKEN.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL_VAR: ${{ vars.AI_REVIEW_MODEL }}
          COPILOT_EFFORT_VAR: ${{ vars.AI_REVIEW_REASONING_EFFORT }}
          COPILOT_MAX_CREDITS_VAR: ${{ vars.AI_REVIEW_MAX_AI_CREDITS || '30' }}
        run: |
          set -uo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then unset COPILOT_GITHUB_TOKEN; fi
          if [ ! -f "$AI_REVIEW_DIR/prompt.txt" ]; then
            echo "Nothing to review."
            exit 0
          fi

          args=(
            --silent
            --no-auto-update
            --no-ask-user
            --no-custom-instructions
            --disable-builtin-mcps
            --disable-client-telemetry
            --disallow-temp-dir
            # Read-only tools only. Deny rules win over everything else.
            --available-tools=view,grep,glob
            --deny-tool=shell
            --deny-tool=write
            --deny-tool=url
            --secret-env-vars=GITHUB_TOKEN,COPILOT_GITHUB_TOKEN
            --share="$AI_REVIEW_DIR/transcript.md"
            -C "$AI_REVIEW_DIR/bundle"
          )
          if [ -n "$COPILOT_MODEL_VAR" ]; then args+=(--model "$COPILOT_MODEL_VAR"); fi
          if [ -n "$COPILOT_EFFORT_VAR" ]; then args+=(--reasoning-effort "$COPILOT_EFFORT_VAR"); fi
          if [ -n "$COPILOT_MAX_CREDITS_VAR" ]; then args+=(--max-ai-credits "$COPILOT_MAX_CREDITS_VAR"); fi

          export COPILOT_HOME="$RUNNER_TEMP/copilot-home"
          mkdir -p "$COPILOT_HOME"

          # The prompt goes in on stdin, so its size is not limited by argv.
          copilot "${args[@]}" < "$AI_REVIEW_DIR/prompt.txt" > "$AI_REVIEW_DIR/model-output.txt"
          code=$?
          echo "$code" > "$AI_REVIEW_DIR/copilot-exit-code"
          echo "Copilot exited with $code"
          # Model output is untrusted: stop it being parsed as workflow commands.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          cat "$AI_REVIEW_DIR/model-output.txt"
          echo "::$stop::"
          # The decide job turns any failure here into an "inconclusive" review.
          exit 0

      - name: Upload review results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review
          path: |
            ${{ runner.temp }}/ai-review/meta.json
            ${{ runner.temp }}/ai-review/model-output.txt
            ${{ runner.temp }}/ai-review/copilot-exit-code
            ${{ runner.temp }}/ai-review/transcript.md
            ${{ runner.temp }}/ai-review/bundle/CHANGES.md
          if-no-files-found: ignore
          retention-days: 30

  decide:
    name: Approve or flag
    needs: review
    if: always() && needs.review.result != 'cancelled' && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download review results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review
          path: ${{ runner.temp }}/ai-review

      - name: Approve, request changes, or comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
          AI_REVIEW_DIR: ${{ runner.temp }}/ai-review
          # Optional: who to ping when a PR looks malicious, e.g. @muxy-app/maintainers.
          AI_REVIEW_ESCALATE: ${{ vars.AI_REVIEW_ESCALATE }}
        run: node scripts/ai-review-decide.mjs
