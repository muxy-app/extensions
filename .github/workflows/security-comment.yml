name: Security comment

# Posting a comment on a fork PR requires a writable base-repository token, so
# this uses pull_request_target. The privileged job checks out trusted tooling
# only. It lists the PR's changed paths and reads every manifest and blob from
# GitHub's API at the exact head SHA, applies strict size/path/type limits, and
# treats every byte as passive data.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "extensions/**"
      - "scripts/**"
      - ".github/workflows/security-comment.yml"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: security-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Analyse changed extensions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target resolves github.sha to the trusted base branch.
      # No fork repository or pull request ref is ever checked out.
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generate and post security report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security-comment-ci.mjs
